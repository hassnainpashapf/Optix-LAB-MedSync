# Optix LAB MedSync Windows installer (NSIS) — electron-builder config.
# Built on Linux via wine. Produces dist-installer/Optix-LAB-MedSync-Setup-<version>.exe
appId: com.labpos.desktop
productName: Optix LAB MedSync
copyright: Copyright © Optix LAB MedSync
electronVersion: 37.10.3

directories:
  app: ./app-stage
  output: ../../dist-installer

files:
  - "**/*"
  - "!**/*.map"

# asar keeps resources/app tidy; node:sqlite is builtin so no native modules to unpack
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../../electron-src/icon.ico
  artifactName: "Optix-LAB-MedSync-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Optix LAB MedSync
  uninstallDisplayName: Optix LAB MedSync
  # classic Next-Next wizard pages are used when oneClick is false
