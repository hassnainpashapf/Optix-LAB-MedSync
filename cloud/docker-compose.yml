# LabPOS cloud stack: API + Postgres 16
# Copy .env.example to .env and fill in secrets before first run.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-labpos}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labpos} -d ${POSTGRES_DB:-labpos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - ./releases.json:/app/releases.json
      - ./releases:/app/releases
      - ./report-pdfs:/app/report-pdfs
    environment:
      PORT: 4000
      BIND_HOST: 0.0.0.0
      DB_ADAPTER: pg
      # pg driver reads these natively (no URL-encoding issues with special chars)
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-labpos}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-labpos}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    name: labpos_pgdata
