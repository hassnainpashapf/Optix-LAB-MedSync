// @optix/sms-gateway — native Android side of the Optix SMS gateway plugin.
// Included automatically by `npx cap sync` (standard Capacitor plugin layout).
apply plugin: 'com.android.library'

android {
    namespace "com.optix.labmedsync.smsgateway"
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ext {
    androidxCoreVersion = rootProject.ext.has('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.15.0'
}

dependencies {
    // No third-party deps: HTTP via HttpURLConnection, SMS via android.telephony.SmsManager.
    // Same dependency layout as every Capacitor plugin: the app's own Capacitor core + androidx.core (ContextCompat, NotificationCompat).
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
}
