apply plugin: 'com.android.library'

android {
    namespace "com.optix.labmedsync.offlinecache"
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

ext {
    capacitorAndroidVersion = project.hasProperty('capacitorAndroidVersion') ? project.getProperty('capacitorAndroidVersion') : '7.4.0'
}

dependencies {
    api "com.capacitorjs:core:$capacitorAndroidVersion"
}
